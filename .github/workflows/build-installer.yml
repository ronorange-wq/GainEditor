name: Build Mac Installer

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: installer
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15-intel   # builds a Universal plugin (Apple Silicon + Intel)
    steps:
      - uses: actions/checkout@v4

      - name: Build Audio Unit
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          cmake --build build --config Release -j 4

      - name: Make installer (.pkg)
        run: |
          AU=$(find build -name "Gain Editor.component" -type d | head -1)
          echo "Component: $AU"
          pkgbuild --component "$AU" \
                   --install-location "/Library/Audio/Plug-Ins/Components" \
                   --identifier com.gaineditor.plugin --version 1.4.0 \
                   "Gain Editor Installer.pkg"

      - name: Validate
        run: |
          sudo installer -pkg "Gain Editor Installer.pkg" -target /
          killall -9 AudioComponentRegistrar || true
          auval -v aufx Gedt Gned | tail -5

      - uses: actions/upload-artifact@v4
        with:
          name: Gain-Editor-Installer
          path: Gain Editor Installer.pkg

      - name: Publish download link (Releases)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # only the newest commit may replace the download
          HEAD_SHA=$(git ls-remote "https://github.com/${{ github.repository }}" refs/heads/main | cut -f1)
          if [ "$HEAD_SHA" != "${{ github.sha }}" ]; then echo "Newer commit exists, not publishing."; exit 0; fi
          gh release delete latest -y --cleanup-tag || true
          gh release create latest "Gain Editor Installer.pkg" \
            --title "Gain Editor - latest build" \
            --notes "Download Gain Editor Installer.pkg, then open it (System Settings > Privacy & Security > Open Anyway if macOS asks). Audio Unit for Ableton, Apple Silicon + Intel."
